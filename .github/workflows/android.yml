name: android ci

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: setup android sdk
        uses: android-actions/setup-android@v3

      - name: install ndk
        run: sdkmanager "ndk;25.2.9519653"

      - name: set ndk environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: install cargo-ndk
        run: cargo install cargo-ndk

      - name: build android library
        run: cargo ndk -t arm64-v8a build --release

      - name: list output
        run: find target -name "*.so" -type f

      - name: upload android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-libraries
          path: target/aarch64-linux-android/release/*.so
