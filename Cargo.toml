[package]
name = "owot-rust-client"
version = "0.1.0"
edition = "2021"

[package.metadata.android]
package = "com.owot.rustclient"
label = "OWOT Rust Client"
min_sdk_version = 23

[package.metadata.android.signing.release]
path = "keystore/release.keystore"
keystore_password = "owotrelease"
key_alias = "owot-release"
key_password = "owotrelease"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "android-game-activity"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.10"
futures-util = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.5"
android_logger = "0.13"

